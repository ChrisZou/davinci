<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stamped at serve time with this server process's id; bridge.ts sends it
         on the WebSocket so a page orphaned by an older process is refused. -->
    <meta name="davinci-boot" content="%%DAVINCI_BOOT%%" />
    <title>davinci · AI Native 图片编辑器</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
